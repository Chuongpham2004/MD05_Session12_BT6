# Docker embedded DNS server luôn nằm ở 127.0.0.11 trong mọi container thuộc user-defined network.
# valid=10s: cache kết quả 10s -> nếu container được tạo lại (IP đổi) Nginx vẫn tìm đúng.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Dùng biến để Nginx phân giải tên lúc runtime (không crash khi service chưa lên)
    set $user_service  http://user-service:8080;
    set $order_service http://order-service:8080;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/users {
        proxy_pass $user_service;
    }

    location /api/orders {
        proxy_pass $order_service;
    }

    location = /health {
        default_type application/json;
        return 200 '{"service":"gateway","status":"UP"}';
    }

    location / {
        return 404;
    }
}
